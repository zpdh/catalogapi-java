services:
  postgres:
    image: postgres:16
    container_name: catalogapi-postgres
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - catalogapi-network
    healthcheck:
      test: "pg_isready -U admin -d catalogdb"
      interval: 10s
      timeout: 5s
      retries: 5
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: catalogapi-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - catalogapi-network
    healthcheck:
      test: "rabbitmq-diagnostics ping"
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./CatalogApi
      dockerfile: Dockerfile
    container_name: catalogapi-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SECURITY_JWT_SECRET: 3f8a2b1c9d4e7f6a0b5c2d1e8f3a7b4c9d2e5f0a1b6c3d8e7f2a5b0c4d9e6f1a
      SECURITY_JWT_EXPIRATION: 86400000
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - catalogapi-network
  
  frontend:
    build:
      context: ./catalogapi-frontend
      dockerfile: Dockerfile
    container_name: catalogapi-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - catalogapi-network

networks:
  catalogapi-network:
    driver: bridge

volumes:
  postgres_data: