spring:
  application:
    name: CatalogApi
  datasource:
    url: jdbc:postgresql://localhost:5432/catalogdb
    username: admin
    password: admin
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080